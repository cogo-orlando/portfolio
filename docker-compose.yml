# ══════════════════════════════════════════
#  DOCKER COMPOSE — Production (en local, identique à Render)
#  Usage : docker compose up -d --build
# ══════════════════════════════════════════
services:

  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      TZ: "Europe/Paris"
    # DATABASE_URL (facultatif) : mets-la dans un fichier .env, jamais dans ce fichier
    env_file:
      - path: .env
        required: false

    # ── Durcissement ──
    read_only: true                 # système de fichiers en lecture seule
    cap_drop: [ALL]                 # aucun privilège Linux
    security_opt:
      - no-new-privileges:true      # impossible de regagner des droits

    # Le healthcheck est défini dans le Dockerfile (le binaire vérifie /health)

    # Render Free = 512 MB : on reste large en dessous
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"