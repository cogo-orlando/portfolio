name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Moindre privilège : le workflow peut seulement lire le code
permissions:
  contents: read

# Un nouveau push annule le run précédent encore en cours sur la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════
  #  Tests, qualité et sécurité du code Go
  # ══════════════════════════════════════════
  test:
    name: Tests & sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # même version que le projet, une seule source de vérité
          cache: true               # modules en cache → CI plus rapide

      - name: Formatage (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Fichiers mal formatés (lance : gofmt -w .) :"
            echo "$unformatted"
            exit 1
          fi

      - name: Analyse statique (go vet)
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Tous les packages, détecteur de concurrence, couverture : en une seule passe
      - name: Tests (+ race + couverture)
        run: go test -count=1 -race -coverprofile=coverage.out ./...

      - name: Couverture
        run: |
          go tool cover -func=coverage.out | tail -1
          echo "### Couverture : $(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')" >> "$GITHUB_STEP_SUMMARY"

      # Vulnérabilités connues dans Go et les dépendances (outil officiel de l'équipe Go)
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.3
          govulncheck ./...

      # Analyse de sécurité du code (version épinglée : pas de surprise d'une version "latest")
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.21.4
          gosec -quiet ./...

  # ══════════════════════════════════════════
  #  L'image Docker se construit et démarre "healthy"
  # ══════════════════════════════════════════
  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t portfolio:ci .

      - name: Démarrage + healthcheck
        run: |
          docker run -d --name portfolio-ci --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true -p 8080:8080 portfolio:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' portfolio-ci)
            echo "état : $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          docker logs portfolio-ci
          exit 1

      - name: Taille de l'image
        run: |
          size=$(docker image inspect portfolio:ci --format '{{.Size}}' | awk '{printf "%.1f MB", $1/1000/1000}')
          echo "Taille : $size"
          echo "### Image Docker : $size" >> "$GITHUB_STEP_SUMMARY"