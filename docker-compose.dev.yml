# ══════════════════════════════════════════
#  DOCKER COMPOSE — Développement (hot reload)
#  Usage : docker compose -f docker-compose.dev.yml up --build
# ══════════════════════════════════════════
services:

  portfolio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: portfolio:dev
    container_name: portfolio_dev
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      TZ: "Europe/Paris"
      GO_ENV: "development"   # templates rechargés à chaque requête
    volumes:
      - .:/app                 # tout le projet → hot reload Air
      - /app/tmp               # dossier de build d'Air, hors du montage
      - gomodcache:/go/pkg/mod # modules Go gardés entre deux lancements

volumes:
  gomodcache: